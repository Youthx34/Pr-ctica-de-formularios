<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="contenedor">
    <form class="formulario" action="#" method="post">
      <h1>Registro</h1>

      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre" required>
      </div>

      <div class="campo">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" placeholder="Introduce tu correo" required>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Introduce tu contraseña" minlength="6" required>
      </div>

      <div class="campo">
        <label for="pais">País</label>
        <select id="pais" name="pais" required>
          <option value="">Selecciona tu país</option>
          <option value="gt">Guatemala</option>
          <option value="mx">México</option>
          <option value="sv">El Salvador</option>
          <option value="hn">Honduras</option>
          <option value="otro">Otro</option>
        </select>
      </div>

      <div class="campo opciones">
        <label><input type="radio" name="genero" value="m"> Masculino</label>
        <label><input type="radio" name="genero" value="f"> Femenino</label>
      </div>

      <div class="campo check">
        <label>
          <input type="checkbox" name="terminos" required>
          Acepto los términos y condiciones
        </label>
      </div>

      <button type="submit">Inicia Sesión</button>

      <p class="texto-final">¿No tienes cuenta? <a href="#">Regístrate</a></p>
    </form>
  </main>

</body>
</html>
